# Prometheus 스크레이프 설정(관측 하네스용).
# NOTE: 앱이 /metrics 를 노출해야 의미가 있다 — 현재 미도입(tech-debt-ledger DEBT-4).
#       도입 시 prometheus-fastapi-instrumentator 등으로 app.main 에 /metrics 를 붙인다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "expense-ai-app"
    metrics_path: /metrics
    static_configs:
      # 호스트에서 uvicorn 으로 띄운 앱(run-local.ps1). 컨테이너→호스트는 host.docker.internal.
      - targets: ["host.docker.internal:8000"]
        labels:
          app: "expense-ai"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
